<style>
  /* Hamburger button: fixed to the window, so it stays put while the page scrolls. */
  #quick-links-toggle {
    --ql-top: 70px;           /* just under the navbar (Minima's is about 62px tall) */
    --ql-page-width: 1400px;  /* match the max-width of your .wrapper in assets/main.scss */
    position: fixed; z-index: 900;
    top: var(--ql-top);
    /* in the left margin on wide screens; 8px from the window edge when there is no margin */
    left: max(8px, calc(50% - var(--ql-page-width) / 2 - 52px));
    width: 40px; height: 40px; padding: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    border: 1px solid #e3e6ea; border-radius: 6px; background: #ffffff; color: #1f2937; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
  }
  #quick-links-toggle span { display: block; width: 20px; height: 2px; border-radius: 1px; background: currentColor; }
  #quick-links-toggle:hover { background: #f1f3f5; }
  #quick-links-toggle:focus-visible, #quick-links-close:focus-visible, #quick-links-panel a:focus-visible {
    outline: 2px solid #2a6fb0; outline-offset: 2px;
  }

  /* Sidebar and the dimmed page behind it. Both are fixed, so where they sit in the HTML doesn't matter. */
  #quick-links-overlay {
    position: fixed; inset: 0; z-index: 9999; background: rgba(0, 0, 0, 0.35);
    opacity: 0; visibility: hidden; transition: opacity 0.2s, visibility 0s 0.2s;
  }
  #quick-links-panel {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 10000;
    box-sizing: border-box; width: 260px; max-width: 80vw; padding: 16px; overflow-y: auto;
    background: #ffffff; color: #1f2937; box-shadow: 2px 0 12px rgba(0, 0, 0, 0.2);
    transform: translateX(-100%); visibility: hidden; transition: transform 0.2s, visibility 0s 0.2s;
  }
  .quick-links-open #quick-links-overlay { opacity: 1; visibility: visible; transition-delay: 0s; }
  .quick-links-open #quick-links-panel { transform: none; visibility: visible; transition-delay: 0s; }
  .quick-links-open { overflow: hidden; } /* stop the page scrolling behind the sidebar */

  #quick-links-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #quick-links-close {
    width: 32px; height: 32px; padding: 0; border: 0; border-radius: 4px;
    background: transparent; color: inherit; font-size: 24px; line-height: 1; cursor: pointer;
  }
  #quick-links-close:hover { background: #f1f3f5; }
  #quick-links-list { list-style: none; margin: 0; padding: 0; }
  #quick-links-list a { display: block; padding: 8px 10px; border-radius: 4px; color: inherit; text-decoration: none; }
  #quick-links-list a:hover { background: #f1f3f5; }
  #quick-links-list a[aria-current="page"] { background: #e8f0fa; font-weight: 600; }

  /* Laptop-width screens have no left margin, so make room for the button by indenting the page a bit.
     Delete this rule if you would rather let the button overlap the page edge. If you change
     --ql-page-width above, change 1500px to about that value + 100px. */
  @media (min-width: 700px) and (max-width: 1500px) {
    .wrapper { padding-left: 56px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #quick-links-overlay, #quick-links-panel { transition: none; }
  }
  .nav-subheading {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.7;
    margin-top: 0.75rem;
    margin-bottom: 0.25rem;
  }

  .nav-sublist {
    list-style: none;
    padding-left: 0.75rem;
    margin: 0;
  }
</style>

<button id="quick-links-toggle" type="button" aria-label="Open page menu" aria-expanded="false" aria-controls="quick-links-panel">
  <span></span><span></span><span></span>
</button>

<div id="quick-links-overlay"></div>
<nav id="quick-links-panel" aria-label="Site pages">
  <div id="quick-links-head">
    <strong>Navigation</strong>
    <button id="quick-links-close" type="button" aria-label="Close page menu">&times;</button>
  </div>
  <ul id="quick-links-list">
    <li class="nav-group">
      <span class="nav-subheading" id="honeycreeper-heading">Avotrex</span>
      <ul class="nav-sublist" aria-labelledby="honeycreeper-heading">
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Map</a></li>
        <li><a href="{{ '/species_tree.html' | relative_url }}"{% if page.url == '/species_tree.html' %} aria-current="page"{% endif %}>About Species</a></li>
        <li><a href="{{ '/species_quality.html' | relative_url }}"{% if page.url == '/species_quality.html' %} aria-current="page"{% endif %}>Data Quality</a></li>
      </ul>
    </li>

    <li class="nav-group">
      <span class="nav-subheading" id="honeycreeper-heading">Honeycreeper</span>
      <ul class="nav-sublist" aria-labelledby="honeycreeper-heading">
        <li><a href="{{ '/honeycreeper_glyph.html' | relative_url }}"{% if page.url == '/honeycreeper_glyph.html' %} aria-current="page"{% endif %}>Glyph Harness</a></li>
        <li><a href="{{ '/honeycreeper_sankey.html' | relative_url }}"{% if page.url == '/honeycreeper_sankey.html' %} aria-current="page"{% endif %}>Sankey</a></li>
        <li><a href="{{ '/phylo_overview.html' | relative_url }}"{% if page.url == '/phylo_overview.html' %} aria-current="page"{% endif %}>Phylo overview</a></li>
      </ul>
    </li>
  </ul>
</nav>

<script>
  (() => {
    const root = document.documentElement;
    const toggle = document.getElementById("quick-links-toggle");
    const panel = document.getElementById("quick-links-panel");
    const overlay = document.getElementById("quick-links-overlay");
    const closeBtn = document.getElementById("quick-links-close");
    if (!toggle || !panel || !overlay || !closeBtn) return;

    function isOpen() { return root.classList.contains("quick-links-open"); }

    function setOpen(open, returnFocus) {
      root.classList.toggle("quick-links-open", open);
      toggle.setAttribute("aria-expanded", String(open));
      if (open) requestAnimationFrame(() => closeBtn.focus());
      else if (returnFocus) toggle.focus();
    }

    toggle.addEventListener("click", () => setOpen(!isOpen(), true));
    closeBtn.addEventListener("click", () => setOpen(false, true));
    overlay.addEventListener("click", () => setOpen(false, false));

    document.addEventListener("keydown", event => {
      if (!isOpen()) return;
      if (event.key === "Escape") { setOpen(false, true); return; }
      if (event.key !== "Tab") return;
      // keep keyboard focus inside the sidebar while it is open
      const items = panel.querySelectorAll("button, a[href]");
      const first = items[0], last = items[items.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    });
  })();
</script>
